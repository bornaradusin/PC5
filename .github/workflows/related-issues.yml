# A new issue told of the other issues about its game, and how each stands
# (.github/scripts/related_issues.py).
name: Related issues

on:
  issues:
    types: [opened]

permissions:
  issues: write    # the comment
  contents: read

concurrency:
  group: related-issues-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  related:
    if: ${{ !github.event.issue.pull_request && !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: The other issues of its game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/related_issues.py

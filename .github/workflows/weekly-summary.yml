# The maintainer's week on one page: the "Weekly summary" issue, written again each Monday
# (.github/scripts/weekly_summary.py).
name: Weekly summary

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the summary"
        type: boolean
        default: false

permissions:
  issues: write        # the summary issue, its labels and its comment
  discussions: read    # the week's game compatibility reports
  contents: read

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - name: The week
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEEKLY_SUMMARY_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 .github/scripts/weekly_summary.py

# The wiki's "Game compatibility" page: the games players report running (the "Game
# compatibility" discussions) and the games with an issue, by how it stands, in one table
# (.github/scripts/compatibility_list.py), made again whenever a discussion or an issue is
# posted, edited, closed or opened again, when the script or its games-by-issue.txt changes,
# and once a day.
name: Compatibility list

on:
  discussion:
    types: [created, edited, deleted, category_changed, transferred]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  push:
    branches: [main]
    paths: [.github/scripts/compatibility_list.py, .github/scripts/games-by-issue.txt, .github/workflows/compatibility.yml]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  discussions: write
  contents: write
  issues: write         # the games with an issue, and one comment on an issue whose game a report lists
  pull-requests: read   # a number that turns out to be a pull request

concurrency:
  group: compatibility-list
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      # A report made on a test version ("test version" at the start of its title) gets the
      # "test version" label, so those reports stay together. Nothing is posted on the issue.
      - name: Label a test version's report
        if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.issue.title }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          shopt -s nocasematch
          if [[ $TITLE =~ ^[[:space:]]*\[?test[[:space:]-]*version ]]; then
            gh issue edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label "test version"
          fi
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Collect the reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/compatibility_list.py

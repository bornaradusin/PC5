# Builds PC5 from source on GitHub's machines (tools/build.sh) and, when asked, makes a draft
# release with its archives for the maintainer to check and publish: the app
# (PPSA11018.zip), the update zip with only what changed since the newest published release
# (PPSA11018-update.zip), the sources and Wine Mono's source.
# Run it from the Actions tab: Build › Run workflow.
#
# The build is in pieces (tools/build.sh names them). Each is kept under its key, a
# fingerprint of everything it is built from, and built again only when its key changes:
# Keys looks them up, and only the pieces it doesn't find are built, side by side, each on a
# machine of its own. They run in the build image (tools/Dockerfile on GitHub's container
# registry, made again only when it or tools/packages.txt changes), so no job installs
# packages. Wine's pieces also keep their trees and objects, and build again only what a
# change to Wine's patches reaches. Release puts the title and the pieces together into the
# app while Sources archives the source, and Publish makes the draft release.
name: Build

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Make a draft release v<PC5_VERSION> with the archives (otherwise they are kept as the run's artifacts)"
        type: boolean
        default: true
      compare_with:
        description: "Compare the app file by file with an earlier one: a release's tag (v1.8.3) or a run's id"
        type: string
        default: ""

permissions:
  contents: write  # the draft release
  packages: write  # the build image
  actions: write   # an earlier run's archives, and the work kept by earlier runs

concurrency:
  group: pc5-build
  cancel-in-progress: false

env:
  PC5_BUILD_DIR: /mnt/pc5/build
  PC5_RELEASE: /mnt/pc5/release

jobs:
  keys:
    name: Keys
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.keys.outputs.version }}
      image: ${{ steps.keys.outputs.image }}
      image_made: ${{ steps.image.outputs.made }}
      radv: ${{ steps.keys.outputs.radv }}
      radv_paths: ${{ steps.keys.outputs.radv_paths }}
      radv_hit: ${{ steps.radv.outputs.cache-hit }}
      tools: ${{ steps.keys.outputs.tools }}
      tools_work: ${{ steps.keys.outputs.tools_work }}
      hostwine: ${{ steps.keys.outputs.hostwine }}
      hostwine_paths: ${{ steps.keys.outputs.hostwine_paths }}
      hostwine_work: ${{ steps.keys.outputs.hostwine_work }}
      hostwine_hit: ${{ steps.hostwine.outputs.cache-hit }}
      wineps5: ${{ steps.keys.outputs.wineps5 }}
      wineps5_paths: ${{ steps.keys.outputs.wineps5_paths }}
      wineps5_work: ${{ steps.keys.outputs.wineps5_work }}
      wineps5_hit: ${{ steps.wineps5.outputs.cache-hit }}
      dxvk: ${{ steps.keys.outputs.dxvk }}
      dxvk_paths: ${{ steps.keys.outputs.dxvk_paths }}
      dxvk_hit: ${{ steps.dxvk.outputs.cache-hit }}
      vkd3d: ${{ steps.keys.outputs.vkd3d }}
      vkd3d_paths: ${{ steps.keys.outputs.vkd3d_paths }}
      vkd3d_hit: ${{ steps.vkd3d.outputs.cache-hit }}
      zink: ${{ steps.keys.outputs.zink }}
      zink_paths: ${{ steps.keys.outputs.zink_paths }}
      zink_hit: ${{ steps.zink.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5

      - name: The keys
        id: keys
        # prospero-win is fetched and patched (seconds): the pieces' keys read it.
        run: |
          sudo mkdir -p /mnt/pc5 && sudo chown "$USER" /mnt/pc5
          tools/build.sh ci >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/pc5-build:$(cat tools/Dockerfile tools/packages.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: The build image
        id: image
        env:
          IMAGE: ${{ steps.keys.outputs.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then made=true; else made=false; fi
          echo "made=$made" >> "$GITHUB_OUTPUT"

      # Which pieces are kept (looked up, not fetched).
      - { name: RADV, id: radv, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.radv_paths }}", key: "${{ steps.keys.outputs.radv }}", lookup-only: true } }
      - { name: "Wine's Windows side", id: hostwine, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.hostwine_paths }}", key: "${{ steps.keys.outputs.hostwine }}", lookup-only: true } }
      - { name: Wine for the PS5, id: wineps5, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.wineps5_paths }}", key: "${{ steps.keys.outputs.wineps5 }}", lookup-only: true } }
      - { name: DXVK, id: dxvk, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.dxvk_paths }}", key: "${{ steps.keys.outputs.dxvk }}", lookup-only: true } }
      - { name: VKD3D-Proton, id: vkd3d, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.vkd3d_paths }}", key: "${{ steps.keys.outputs.vkd3d }}", lookup-only: true } }
      - { name: Zink, id: zink, uses: actions/cache/restore@v5,
          with: { path: "${{ steps.keys.outputs.zink_paths }}", key: "${{ steps.keys.outputs.zink }}", lookup-only: true } }

      - name: What is built
        run: |
          {
            echo "### PC5 ${{ steps.keys.outputs.version }}: the pieces"
            echo '| Piece | Key | |'
            echo '|---|---|---|'
            for piece in radv hostwine wineps5 dxvk vkd3d zink; do
              case $piece in
                radv) key='${{ steps.keys.outputs.radv }}' hit='${{ steps.radv.outputs.cache-hit }}' ;;
                hostwine) key='${{ steps.keys.outputs.hostwine }}' hit='${{ steps.hostwine.outputs.cache-hit }}' ;;
                wineps5) key='${{ steps.keys.outputs.wineps5 }}' hit='${{ steps.wineps5.outputs.cache-hit }}' ;;
                dxvk) key='${{ steps.keys.outputs.dxvk }}' hit='${{ steps.dxvk.outputs.cache-hit }}' ;;
                vkd3d) key='${{ steps.keys.outputs.vkd3d }}' hit='${{ steps.vkd3d.outputs.cache-hit }}' ;;
                zink) key='${{ steps.keys.outputs.zink }}' hit='${{ steps.zink.outputs.cache-hit }}' ;;
              esac
              [ "$hit" = true ] && what=kept || what=built
              echo "| $piece | \`$key\` | $what |"
            done
            [ '${{ steps.image.outputs.made }}' = true ] && echo "Build image: kept." || echo "Build image: made."
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build image
    needs: keys
    if: needs.keys.outputs.image_made != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Make it and keep it
        env:
          IMAGE: ${{ needs.keys.outputs.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" tools
          docker push "$IMAGE"

  radv:
    name: RADV
    needs: [keys, image]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.keys.outputs.radv_hit != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - run: tools/build.sh radv
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.radv_paths }}", key: "${{ needs.keys.outputs.radv }}" }
      - uses: ./.github/actions/report
        if: failure()
        with: { name: radv }

  hostwine:
    name: Wine's Windows side
    needs: [keys, image]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.keys.outputs.hostwine_hit != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        run: echo "id=$(tools/build.sh toolchain)" >> "$GITHUB_OUTPUT"
      # Its last tree and objects, made with the same compilers.
      - name: Its last build
        uses: actions/cache/restore@v5
        with:
          path: ${{ needs.keys.outputs.hostwine_work }}
          key: hostwine-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.hostwine }}
          restore-keys: hostwine-work-${{ steps.toolchain.outputs.id }}-
      - run: tools/build.sh hostwine
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.hostwine_paths }}", key: "${{ needs.keys.outputs.hostwine }}" }
      - name: Keep this build
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ needs.keys.outputs.hostwine_work }}
          key: hostwine-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.hostwine }}
      - uses: ./.github/actions/report
        if: failure()
        with: { name: hostwine }

  wineps5:
    name: Wine for the PS5
    needs: [keys, image, radv]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.radv.result != 'failure' && needs.keys.outputs.wineps5_hit != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        run: echo "id=$(tools/build.sh toolchain)" >> "$GITHUB_OUTPUT"
      - name: RADV
        uses: actions/cache/restore@v5
        with: { path: "${{ needs.keys.outputs.radv_paths }}", key: "${{ needs.keys.outputs.radv }}", fail-on-cache-miss: true }
      # Wine's tools and the PS5 Wine on their last trees and objects, made with the same compilers.
      - name: The tools' last build
        uses: actions/cache/restore@v5
        with:
          path: ${{ needs.keys.outputs.tools_work }}
          key: tools-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.tools }}
          restore-keys: tools-work-${{ steps.toolchain.outputs.id }}-
      - name: Its last build
        uses: actions/cache/restore@v5
        with:
          path: ${{ needs.keys.outputs.wineps5_work }}
          key: wineps5-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.wineps5 }}
          restore-keys: wineps5-work-${{ steps.toolchain.outputs.id }}-
      - run: tools/build.sh tools
      - run: tools/build.sh wineps5
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.wineps5_paths }}", key: "${{ needs.keys.outputs.wineps5 }}" }
      - name: Keep the tools' build
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ needs.keys.outputs.tools_work }}
          key: tools-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.tools }}
      - name: Keep this build
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ needs.keys.outputs.wineps5_work }}
          key: wineps5-work-${{ steps.toolchain.outputs.id }}-${{ needs.keys.outputs.wineps5 }}
      - uses: ./.github/actions/report
        if: failure()
        with: { name: wineps5 }

  dxvk:
    name: DXVK
    needs: [keys, image]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.keys.outputs.dxvk_hit != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - run: tools/build.sh dxvk
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.dxvk_paths }}", key: "${{ needs.keys.outputs.dxvk }}" }
      - uses: ./.github/actions/report
        if: failure()
        with: { name: dxvk }

  vkd3d:
    name: VKD3D-Proton
    needs: [keys, image]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.keys.outputs.vkd3d_hit != 'true' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - run: tools/build.sh vkd3d
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.vkd3d_paths }}", key: "${{ needs.keys.outputs.vkd3d }}" }
      - uses: ./.github/actions/report
        if: failure()
        with: { name: vkd3d }

  zink:
    name: Zink
    needs: keys
    if: needs.keys.outputs.zink_hit != 'true'
    # On the machine itself, not in the image: Zink's link wants about 8 GB of memory a job,
    # more than the machine has without the swap file made here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Memory and packages
        run: |
          sudo mkdir -p /mnt/pc5 && sudo chown "$USER" /mnt/pc5
          sudo fallocate -l 8G /mnt/pc5/swap && sudo chmod 600 /mnt/pc5/swap
          sudo mkswap /mnt/pc5/swap > /dev/null && sudo swapon /mnt/pc5/swap
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          apt="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get update -q $apt
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -q --no-install-recommends $apt \
            -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=300 $(cat tools/packages.txt)
      - run: tools/build.sh zink
        env: { PC5_ZINK_JOBS: "2" }
      - uses: actions/cache/save@v5
        with: { path: "${{ needs.keys.outputs.zink_paths }}", key: "${{ needs.keys.outputs.zink }}" }
      - uses: ./.github/actions/report
        if: failure()
        with: { name: zink }

  sources:
    name: Sources
    # The source of everything in the app, archived while the app is put together. In the
    # build image as the pieces are: GitHub's cache keeps a path outside the checkout relative
    # to the checkout, which is elsewhere on the machine itself.
    needs: [keys, image, radv]
    if: ${{ !cancelled() && needs.keys.result == 'success' && needs.image.result != 'failure' && needs.radv.result != 'failure' }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - name: RADV
        uses: actions/cache/restore@v5
        with: { path: "${{ needs.keys.outputs.radv_paths }}", key: "${{ needs.keys.outputs.radv }}", fail-on-cache-miss: true }
      - run: tools/build.sh bundle
      # PC5's host checks (tests/test.sh) on the sources just fetched: a change that fails
      # them makes no draft release.
      - name: Tests
        shell: bash
        # Its output kept with the build's logs, so a failure's end shows on the run's page.
        run: mkdir -p "$PC5_BUILD_DIR/logs" && tests/test.sh 2>&1 | tee "$PC5_BUILD_DIR/logs/tests.log"
      - uses: actions/upload-artifact@v7
        with:
          name: sources
          path: ${{ env.PC5_RELEASE }}/PPSA11018-sources.tar.xz
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/report
        if: failure()
        with: { name: sources }

  release:
    name: Release
    needs: [keys, image, hostwine, wineps5, dxvk, vkd3d, zink]
    if: ${{ !cancelled() && needs.keys.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.keys.outputs.image }}
      credentials: { username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      volumes: [/mnt/pc5:/mnt/pc5]
    steps:
      - uses: actions/checkout@v5
      - { name: "Wine's Windows side", uses: actions/cache/restore@v5,
          with: { path: "${{ needs.keys.outputs.hostwine_paths }}", key: "${{ needs.keys.outputs.hostwine }}", fail-on-cache-miss: true } }
      - { name: Wine for the PS5, uses: actions/cache/restore@v5,
          with: { path: "${{ needs.keys.outputs.wineps5_paths }}", key: "${{ needs.keys.outputs.wineps5 }}", fail-on-cache-miss: true } }
      - { name: DXVK, uses: actions/cache/restore@v5,
          with: { path: "${{ needs.keys.outputs.dxvk_paths }}", key: "${{ needs.keys.outputs.dxvk }}", fail-on-cache-miss: true } }
      - { name: VKD3D-Proton, uses: actions/cache/restore@v5,
          with: { path: "${{ needs.keys.outputs.vkd3d_paths }}", key: "${{ needs.keys.outputs.vkd3d }}", fail-on-cache-miss: true } }
      - { name: Zink, uses: actions/cache/restore@v5,
          with: { path: "${{ needs.keys.outputs.zink_paths }}", key: "${{ needs.keys.outputs.zink }}", fail-on-cache-miss: true } }
      - name: Title
        run: tools/build.sh title
      - name: Package
        run: tools/build.sh package
      - name: App
        run: tools/build.sh app
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            ${{ env.PC5_RELEASE }}/PPSA11018.zip
            ${{ env.PC5_RELEASE }}/wine-mono-*-src.tar.xz
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/report
        if: failure()
        with: { name: release }

  publish:
    name: Publish
    needs: [keys, release, sources]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.sources.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.keys.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with: { name: app, path: release }
      - uses: actions/download-artifact@v8
        with: { name: sources, path: release }

      - name: The update zip
        # PPSA11018-update.zip: the files that differ from the newest published release's
        # PPSA11018.zip, and the new release's list of its files (tools/make-update.py).
        # PC5's updater uses it when the console's files are that release's; otherwise it
        # downloads PPSA11018.zip. The release's notes name that release in a line GitHub
        # doesn't show (<!-- pc5-update-from: 1.9.7 -->): from 1.9.8, PC5 takes the whole app
        # at once when it is older than that. The zip keeps its name as the release shows it
        # (1.9.7's release named it by a label instead, which 1.9.7 reads).
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case $base in v[0-9]*) ;; *) base= ;; esac   # none published: GitHub answers 404
          if [ -z "$base" ]; then
            echo "::notice title=No update zip::No release is published yet, so there is nothing to make an update from"
            exit 0
          fi
          if [ "$base" = "v$VERSION" ]; then
            if [ '${{ inputs.draft_release }}' = true ]; then
              echo "::error::v$VERSION is already the newest published release; raise PC5_VERSION in title/pc5.h for a new release"
              exit 1
            fi
            echo "::notice title=No update zip::v$VERSION is the newest published release itself"
            exit 0
          fi
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$base" --jq '.assets[] | select(.name == "PPSA11018.zip") | .id')
          if [ -z "$asset" ]; then
            echo "::notice title=No update zip::$base, the newest published release, has no PPSA11018.zip"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" \
            > "$RUNNER_TEMP/base/PPSA11018.zip"
          python3 tools/make-update.py "$RUNNER_TEMP/base/PPSA11018.zip" release/PPSA11018.zip \
            release/PPSA11018-update.zip --markdown "$GITHUB_STEP_SUMMARY" | tee update.txt
          echo "Made against $base's PPSA11018.zip." >> "$GITHUB_STEP_SUMMARY"
          echo "${base#v}" > release/update-from.txt
          echo "::notice title=Update zip against $base::$(sed 's/^make-update: [^:]*: //' update.txt)"

      - uses: actions/upload-artifact@v7
        with:
          name: update
          path: release/PPSA11018-update.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: The archives
        working-directory: release
        run: |
          ls -l
          sha256sum PPSA11018.zip $(ls PPSA11018-update.zip 2>/dev/null) PPSA11018-sources.tar.xz \
            wine-mono-*-src.tar.xz | tee SHA256SUMS.txt
          { echo "### PC5 $VERSION"; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with ${{ inputs.compare_with }}
        if: inputs.compare_with != ''
        env:
          WITH: ${{ inputs.compare_with }}
        run: |
          mkdir -p "$RUNNER_TEMP/earlier"
          case $WITH in
            *[!0-9]*) gh release download "$WITH" -p PPSA11018.zip -D "$RUNNER_TEMP/earlier" ||
                        { echo "::error::No release $WITH with PPSA11018.zip to compare with (a deleted release has none)"; exit 1; } ;;
            *) gh run download "$WITH" -D "$RUNNER_TEMP/earlier" ||
                 { echo "::error::Run $WITH has no artifacts to compare with (they expire after a while)"; exit 1; } ;;
          esac
          earlier=$(find "$RUNNER_TEMP/earlier" -name PPSA11018.zip | head -1)
          [ -n "$earlier" ] || { echo "::error::$WITH has no PPSA11018.zip"; exit 1; }
          python3 tools/compare-app.py "$earlier" release/PPSA11018.zip --markdown "$GITHUB_STEP_SUMMARY" | tee compare.txt
          echo "::notice title=Against $WITH::$(tail -1 compare.txt)"
          # The files that differ, a notice of up to 3000 characters (the summary has them all).
          list=$(head -n -1 compare.txt | cut -c1-200 | head -c 3000 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          [ -z "$list" ] || echo "::notice title=What differs from $WITH::$list"

      - name: Draft release
        if: inputs.draft_release
        # Notes from release-notes/<version>.md. A draft left by an earlier run is replaced;
        # a published release is never touched.
        run: |
          tag="v$VERSION"
          state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$tag is already published; raise PC5_VERSION in title/pc5.h for a new release"
            exit 1
          fi
          [ "$state" = none ] || gh release delete "$tag" --yes
          notes="release-notes/$VERSION.md"
          [ -f "$notes" ] || { echo "PC5 $VERSION" > "$RUNNER_TEMP/notes.md"; notes=$RUNNER_TEMP/notes.md; }
          if [ -f release/PPSA11018-update.zip ]; then
            { cat "$notes"; printf '\n<!-- pc5-update-from: %s -->\n' "$(cat release/update-from.txt)"; } > "$RUNNER_TEMP/notes-update.md"
            notes=$RUNNER_TEMP/notes-update.md
          fi
          # A test version (PC5_VERSION with a suffix: 2.3.1-programs-test) is a pre-release, and
          # its app zip is PPSA11018-test.zip beside PPSA11018-update.zip: the homebrew catalog
          # moves its listing to the newest release, pre-releases included, when the release
          # has a file named as the listed one (PPSA11018.zip) or only one zip. Two zips with
          # neither name, it leaves the listing as it is.
          app=release/PPSA11018.zip pre=
          case $VERSION in
            *[!0-9.]*)
              [ -f release/PPSA11018-update.zip ] ||
                { echo "::error::A test version needs its update zip, or the catalog would take its only zip"; exit 1; }
              mv release/PPSA11018.zip release/PPSA11018-test.zip
              app=release/PPSA11018-test.zip pre=--prerelease ;;
          esac
          gh release create "$tag" --draft $pre --target "$GITHUB_SHA" --title "PC5 $VERSION" --notes-file "$notes" \
            "$app" $(ls release/PPSA11018-update.zip 2>/dev/null) release/PPSA11018-sources.tar.xz \
            release/wine-mono-*-src.tar.xz
          echo "Draft release $tag is ready: check it and publish it from the Releases page." >> "$GITHUB_STEP_SUMMARY"

      - name: Only the newest work kept
        # Each Wine piece's last build is what the next one starts from: older ones are left
        # to nothing, so they don't push the pieces out of the 10 GB GitHub keeps.
        continue-on-error: true
        run: |
          for prefix in tools-work- hostwine-work- wineps5-work-; do
            gh cache list --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
              while read -r id; do gh cache delete "$id"; done
          done

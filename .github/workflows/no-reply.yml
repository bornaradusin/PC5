# An issue whose reporter hasn't answered the maintainer for two days is closed, its game
# shown in the compatibility list as needing testing; a reply opens it again
# (.github/scripts/no_reply.py).
name: No reply

on:
  schedule:
    - cron: "41 5 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say which issues it would close"
        type: boolean
        default: false

permissions:
  issues: write    # the comment, the label, closing and opening again
  actions: write   # the compatibility list made again
  contents: read

concurrency:
  group: no-reply
  cancel-in-progress: false

jobs:
  issues:
    # A comment matters only on an issue closed for no reply.
    if: github.event_name != 'issue_comment' || (github.event.issue.state == 'closed' && contains(github.event.issue.labels.*.name, 'needs testing'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Close or open again
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_REPLY_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 .github/scripts/no_reply.py
